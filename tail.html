<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Document</title>
</head>
<body>
<nav class="bg-gray-900 w-full py-4">
<div class="mx-auto">
<!-- navbar -->
<div class="flex justify-between items-center px-4 md:px-20">
  <div class="text-white">Logo</div>

  <!-- Desktop menu  -->
   <div class="hidden md:flex">
    <ul class="flex text-white gap-x-20">
      <li class="hover:text-blue-200">Home</li>
      <li class="hover:text-blue-200">About</li>
      <li class="hover:text-blue-200">Services</li>
      <li class="hover:text-blue-200">Contact</li>
    </ul>
   </div>

   <button class="text-white md:hidden" id="menu-btn" aria-label="Toggle menu"
   >
      ☰
   </button>
</div>
<!-- mobile menu -->

<div id="mobile-menu" class="flex flex-col text-white gap-y-5 px-5 md:hidden hidden text-right">

  <div class="hover:text-blue-200">About</div>

</div>


</div>
</nav> 

<!-- hero section  -->

<section>
<div class=" bg-gray-900 bg-[url(img/fav.avif)] bg-cover bg-center h-screen py-30 px-20 bg-blend-overlay flex justify-between">
  <div class="text-white space-y-5">
    <p class="">this is a website </p>
    <h1 class="text-4xl">Welcome to Our Website</h1>
    <p>lore ipsum dolor sit amet  lore ipsum dolor sit amet</p>
    <div class="flex gap-x-5"> 
      <button class="bg-[#353029] py-3 px-5 rounded hover:bg-[#e8961b]">Book us </button>
      <button class="border py-3 px-5 hover:bg-[#a0988d] rounded">Explore </button>
    </div>
  </div>
  <div class="bg-white h-50 w-110">

  </div>

</div>

</section>
  
<script>
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>
</body>
</html>
