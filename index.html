<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
</head>
<body>
  
  <nav class="bg-gray-900 w-full py-5 text-white">
    <div class="flex justify-between items-center px-5 md:px-20">
      <!-- logo  -->
      <div class="font-bold text-xl text-white ">mylogo</div>

      <!-- desktop menu -->
      <div class="hidden md:flex space-x-4">
        <a href="#" class="hover:text-gray-300">Home</a>
        <a href="#" class="hover:text-gray-300">About</a>
        <a href="#" class="hover:text-gray-300">Services</a>
        <a href="#" class="hover:text-gray-300">Contact</a>
      </div>

       <!-- Hamburger -->
      <button
        id="menu-btn"
        class="text-2xl md:hidden"
        aria-label="Toggle menu"
      >
        ☰
      </button>
    </div>

      <!-- mobile menu button -->
        <div id="mobile-menu" class="hidden pb-4 md:hidden px-5">
      <a href="#" class="block py-2 hover:text-blue-400">Home</a>
      <a href="#" class="block py-2 hover:text-blue-400">About</a>
      <a href="#" class="block py-2 hover:text-blue-400">Services</a>
      <a href="#" class="block py-2 hover:text-blue-400">Contact</a>
    </div>


  </nav>

    <script>
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>
</body>
</html>
